<a
  href="#contenido"
  class="sr-only rounded-lg bg-tz-surface px-4 py-2 font-semibold text-tz-title focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50"
  >Saltar al contenido</a
>

<!-- Menú lateral fijo (escritorio) -->
<aside class="fixed inset-y-0 left-0 z-40 hidden w-60 border-r border-tz-line bg-tz-surface lg:block">
  <app-dashboard-sidebar (logout)="logout()" />
</aside>

<!-- Menú lateral en móvil -->
<p-drawer [visible]="menuOpen()" (visibleChange)="menuOpen.set($event)" position="left" styleClass="w-64" ariaCloseLabel="Cerrar menú">
  <app-dashboard-sidebar (navigate)="menuOpen.set(false)" (logout)="logout()" />
</p-drawer>

<div class="flex min-h-dvh flex-col lg:pl-60">
  <app-dashboard-header [title]="pageTitle()" (openMenu)="menuOpen.set(true)" (logout)="logout()" />

  @if (auth.isPendingTeacher()) {
    <div class="border-b border-tz-line bg-tz-soft" role="status">
      <div class="flex items-start gap-3 px-4 py-3 text-sm sm:px-6 lg:px-8">
        <i class="pi pi-clock mt-0.5 text-tz-subtitle" aria-hidden="true"></i>
        <p>
          <strong class="font-semibold text-tz-title">Tu perfil de profesor está en revisión.</strong>
          Te avisaremos cuando el equipo de Tizzo lo apruebe para que puedas publicar cursos.
        </p>
      </div>
    </div>
  }

  <main id="contenido" class="flex-1 px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
    <router-outlet />
  </main>
</div>
