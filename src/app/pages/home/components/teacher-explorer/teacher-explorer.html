<section id="explorar" class="scroll-mt-20 border-t border-tz-line bg-tz-section py-16" aria-labelledby="explorar-titulo">
  <div class="tz-container">
    <h2 id="explorar-titulo" class="text-2xl font-semibold sm:text-3xl">Explora por tema</h2>

    <ul class="mt-6 flex flex-wrap gap-2.5" aria-label="Temas">
      @for (topic of topics(); track topic) {
        <li>
          <!-- Un botón por estado: pButton no quita la clase p-button-outlined si [outlined] cambia en caliente -->
          @if (selectedTopic() === topic) {
            <button pButton type="button" size="small" [rounded]="true" [label]="topic" aria-pressed="true" (click)="toggleTopic(topic)"></button>
          } @else {
            <button
              pButton
              type="button"
              size="small"
              severity="secondary"
              [rounded]="true"
              [outlined]="true"
              [label]="topic"
              class="bg-tz-surface"
              aria-pressed="false"
              (click)="toggleTopic(topic)"
            ></button>
          }
        </li>
      }
    </ul>

    <div id="destacados" class="mt-16 flex scroll-mt-24 items-end justify-between gap-4">
      <h2 class="text-2xl font-semibold sm:text-3xl">Profes destacados</h2>
      <a pButton href="#destacados" label="Ver todos" icon="pi pi-arrow-right" iconPos="right" size="small" [text]="true"></a>
    </div>

    <ul class="mt-6 grid gap-5 sm:grid-cols-2 lg:grid-cols-4" aria-label="Profes destacados">
      @for (teacher of teachers(); track teacher.id) {
        <li>
          <app-teacher-card [teacher]="teacher" />
        </li>
      }
    </ul>
  </div>
</section>
