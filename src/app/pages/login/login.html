<section class="tz-container flex items-center justify-center py-12 sm:py-20">
  <div class="tz-card w-full max-w-md p-7 sm:p-10">
    <h1 class="text-3xl font-semibold tracking-tight">Ingresa a Tizzo</h1>
    <p class="mt-2 text-tz-body">Qué bueno verte de nuevo.</p>

    @if (error(); as message) {
      <p-message severity="error" styleClass="mt-6" role="alert">{{ message }}</p-message>
    }

    <form #formRef class="mt-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div>
        <label for="email" class="tz-label">Correo</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full"
          aria-describedby="email-error"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
        <app-field-error id="email-error" [control]="form.controls.email" />
      </div>

      <div>
        <label for="password" class="tz-label">Contraseña</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
          autocomplete="current-password"
        />
        <app-field-error id="password-error" [control]="form.controls.password" />
      </div>

      <button
        pButton
        type="submit"
        [label]="submitting() ? 'Ingresando…' : 'Ingresar'"
        [loading]="submitting()"
        [disabled]="submitting()"
        [fluid]="true"
      ></button>
    </form>

    <p class="mt-6 text-center text-sm">
      ¿Aún no tienes cuenta?
      <a routerLink="/registro" class="tz-focus rounded font-semibold text-tz-subtitle underline-offset-4 hover:underline">Crear cuenta</a>
    </p>
  </div>
</section>
