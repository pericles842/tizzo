<app-auth-shell heading="Qué bueno verte de nuevo" description="Entra y sigue aprendiendo o enseñando en vivo con personas reales.">
  <p authTop class="text-tz-body">
    ¿No tienes cuenta?
    <a routerLink="/registro" class="tz-focus rounded font-semibold text-tz-subtitle underline-offset-4 hover:underline">Crear cuenta</a>
  </p>

  <h2 class="text-2xl font-semibold sm:text-3xl">Ingresa a Tizzo</h2>
  <p class="mt-2 text-sm">Usa el correo y la contraseña de tu cuenta.</p>

  @if (error(); as message) {
    <p-message severity="error" styleClass="mt-5" role="alert">{{ message }}</p-message>
  }

  <form #formRef class="mt-6 space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label for="email" class="tz-label">Correo electrónico</label>
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="tu@correo.com"
        class="w-full"
        aria-describedby="email-error"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      <app-field-error errorId="email-error" [control]="form.controls.email" />
    </div>

    <div>
      <label for="password" class="tz-label">Contraseña</label>
      <p-password inputId="password" formControlName="password" [feedback]="false" [toggleMask]="true" [fluid]="true" autocomplete="current-password" />
      <app-field-error errorId="password-error" [control]="form.controls.password" />
    </div>

    <button
      pButton
      type="submit"
      [label]="submitting() ? 'Ingresando…' : 'Entrar'"
      [loading]="submitting()"
      [disabled]="submitting()"
      [fluid]="true"
    ></button>
  </form>
</app-auth-shell>
